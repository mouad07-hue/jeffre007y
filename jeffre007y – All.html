<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jeffre007y – All my channels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfeeee; --text:#10222b; --shell:#2ec4b6; --edge:#0b3a40; --panel:#f6fbfb; --muted:#3d5a63;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1020; --text:#e8f4f2; --shell:#2ec4b6; --edge:#021518; --panel:#1b1f38; --muted:#9db6bb;}
}
:root[data-theme="dark"]{--bg:#0e1020; --text:#e8f4f2; --shell:#2ec4b6; --edge:#021518; --panel:#1b1f38; --muted:#9db6bb;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:26px 18px 30px}
.tv{position:relative;margin-top:104px;background:var(--shell);border:5px solid var(--edge);border-radius:34px;padding:18px 18px 14px;box-shadow:0 8px 0 var(--edge)}
.tv::before,.tv::after{content:"";position:absolute;top:-46px;width:5px;height:46px;background:var(--edge);border-radius:3px;transform-origin:bottom}
.tv::before{left:30%;transform:rotate(-24deg)}.tv::after{right:30%;transform:rotate(24deg)}
.screen{position:relative;aspect-ratio:4/3.2;border:5px solid var(--edge);border-radius:26px / 22px;overflow:hidden;background:#000;isolation:isolate;--tint:transparent}
.bars{position:absolute;inset:0;background:linear-gradient(90deg,#c8c8c8 0 14.28%,#c8c800 0 28.56%,#00c8c8 0 42.84%,#00c800 0 57.12%,#c800c8 0 71.4%,#c80000 0 85.68%,#0000c8 0);opacity:.9;animation:hue 9s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.tintlayer{position:absolute;inset:0;background:var(--tint);mix-blend-mode:multiply;transition:background .25s}
.noise{position:absolute;inset:-20%;opacity:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");mix-blend-mode:screen;animation:grain .25s steps(4) infinite}
.screen.tuning .noise{opacity:.95}
@keyframes grain{25%{transform:translate(-6%,4%)}50%{transform:translate(5%,-5%)}75%{transform:translate(-3%,-6%)}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);z-index:3;pointer-events:none}
.roll{position:absolute;left:0;right:0;height:22%;top:-25%;background:linear-gradient(transparent,rgba(255,255,255,.22),transparent);animation:roll 5s linear infinite;z-index:3}
@keyframes roll{to{top:110%}}
.show{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;font-family:"VT323",monospace;color:#fff;text-shadow:3px 0 #ff2a6d,-3px 0 #05d9e8,0 0 14px rgba(0,0,0,.6)}
.show h1{margin:0;font-weight:400;font-size:clamp(3rem,15vw,5.2rem);line-height:.95;animation:glitch 6s infinite;background:rgba(0,0,0,.45);padding:2px 14px}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-6px) skewX(8deg)}95%{transform:translateX(7px)}97%{transform:translateX(-3px) skewX(-6deg)}}
.show p{margin:0;font-size:clamp(1.3rem,5vw,1.8rem);background:rgba(0,0,0,.45);padding:0 10px}
#now::after{content:"_";animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.knobs{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 6px}
.knob{width:34px;height:34px;border-radius:50%;background:var(--panel);border:4px solid var(--edge);position:relative}
.knob::after{content:"";position:absolute;left:50%;top:3px;width:4px;height:11px;margin-left:-2px;background:var(--edge);border-radius:2px;transform-origin:50% 11px;transform:rotate(var(--r,0deg));transition:transform .4s}
.vents{flex:1;height:22px;margin:0 16px;background:repeating-linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 11px);border-radius:3px;opacity:.85}
.channels{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:12px}
.channels a{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;background:var(--panel);color:var(--text);text-decoration:none;border:3px solid var(--edge);border-radius:18px;transition:transform .15s,background .15s}
.channels a:hover,.channels a:focus-visible{transform:translateX(6px);background:var(--c)}
.channels a:hover *,.channels a:focus-visible *{color:#10222b}
.channels a:focus-visible{outline:4px solid var(--text);outline-offset:3px}
.logo{flex:none;width:54px;height:54px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:15px;background:var(--bb,var(--c));transition:transform .25s}
.logo svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.logo .f{fill:#fff;stroke:none}
.channels a:hover .logo,.channels a:focus-visible .logo{transform:rotate(-8deg) scale(1.1)}
.nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.nm b{font-size:1.25rem}
.nm span{font-size:.95rem;color:var(--muted)}
.open{margin-left:auto;font-weight:700;font-size:.95rem}
/* people */
.person{--skin:#f0c3a0;--hair:#3a2a20;--shirt:#ffb347;--pants:#2f3e63;--shoe:#f4f1ea;pointer-events:none}
.person svg{display:block;width:100%;overflow:visible}
.person .skin{fill:var(--skin)}.person .hr{fill:var(--hair)}.person .sh{fill:#000;opacity:.16}
.person .shirt{fill:var(--shirt)}.person .pant{fill:var(--pants)}
.person .shoe{fill:var(--shoe);stroke:rgba(0,0,0,.3);stroke-width:1.5}
.person .sl{fill:none;stroke:var(--shirt);stroke-width:11;stroke-linecap:round}
.person .fo{fill:none;stroke:var(--skin);stroke-width:8;stroke-linecap:round}
.person .ft{fill:none;stroke:#2a1a14;stroke-width:1.8;stroke-linecap:round}
.person .eye{fill:#2a1a14}
.person .blush{fill:#ff7a7a;opacity:.22}
.person .hairb{display:none}.person.long .hairb{display:block}
.person g{transform-box:view-box}
.person .armL{transform-origin:33px 58px}.person .armR{transform-origin:67px 58px}
.person .legL{transform-origin:43px 104px}.person .legR{transform-origin:57px 104px}
.person .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes step{50%{transform:rotate(24deg)}}
@keyframes stepb{50%{transform:rotate(-24deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-128deg)}}
@keyframes sway{50%{transform:rotate(2.2deg)}}
@keyframes jump{30%{transform:translateY(-22px)}60%{transform:none}}
.peek{position:absolute;left:50%;bottom:100%;width:86px;margin-left:-43px;pointer-events:auto;cursor:pointer}
.peek svg{animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.peek .armR{animation:wave .9s ease-in-out infinite}
.peek .armL{transform:rotate(6deg)}
.peek.jump{animation:jump .55s ease-out}
.street{position:relative;height:132px;width:100vw;margin:18px 0 0 calc(50% - 50vw);border-bottom:2px solid var(--edge);overflow:hidden}
.walker{position:absolute;bottom:2px;left:0;width:56px}
.walker .in{animation:bob .6s ease-in-out infinite}
.w1{animation:walkr 24s linear infinite}
.w2{animation:walkl 31s linear infinite;--skin:#8d5a3b;--hair:#15110f;--shirt:#4a6cf7;--pants:#2a2a33;scale:-1 1}
.w2.person.long{--hair:#7a3b1d}
.walker .legL,.walker .armR{animation:step .6s ease-in-out infinite}
.walker .legR,.walker .armL{animation:stepb .6s ease-in-out infinite}
@keyframes walkr{from{transform:translateX(-90px)}to{transform:translateX(100vw)}}
@keyframes walkl{from{transform:translateX(100vw)}to{transform:translateX(-90px)}}
footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .peek .armR{transform:rotate(-140deg)}
  .w1{left:25%}.w2{left:62%}
}
</style>
</head>
<body>
<main>
  <div class="tv">
    <div class="person peek" data-jump data-half></div>
    <div class="screen" id="screen">
      <div class="bars"></div><div class="tintlayer"></div><div class="noise"></div>
      <div class="show"><h1>jeffre007y</h1><p id="now">Pick a channel</p></div>
      <div class="roll"></div><div class="scan"></div>
    </div>
    <div class="knobs"><div class="knob" id="k1"></div><div class="vents"></div><div class="knob" id="k2"></div></div>
  </div>

  <ul class="channels">
    <li><a href="https://www.tiktok.com/@jeffre007y" target="_blank" rel="noopener" style="--c:#7be0c3;--bb:#0d0d12" data-n="1" data-ch="CH 01  TikTok" data-tint="#7be0c3"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true" style="filter:drop-shadow(-1.5px -1px 0 #25f4ee) drop-shadow(1.5px 1px 0 #fe2c55)"><path d="M26 6v24.5a7.5 7.5 0 1 1-7.5-7.5"/><path d="M26 6c.6 5 4 8.5 10 9"/></svg></span><span class="nm"><b>TikTok</b><span>@jeffre007y</span></span><span class="open">Watch</span></a></li>
    <li><a href="https://www.instagram.com/jeffre007y/" target="_blank" rel="noopener" style="--c:#ff9ec4;--bb:linear-gradient(200deg,#f6a23a,#e1306c 45%,#6a3de0)" data-n="2" data-ch="CH 02  Instagram" data-tint="#ff9ec4"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="11"/><circle cx="24" cy="24" r="8.5"/><circle cx="35" cy="13" r="1.8" fill="#fff"/></svg></span><span class="nm"><b>Instagram</b><span>@jeffre007y</span></span><span class="open">Follow</span></a></li>
    <li><a href="https://www.youtube.com/@jeffre007y" target="_blank" rel="noopener" style="--c:#ffb347;--bb:#e02424" data-n="3" data-ch="CH 03  YouTube" data-tint="#ffb347"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="11" width="40" height="26" rx="9"/><path d="M20 18v12l11-6z" fill="#fff"/></svg></span><span class="nm"><b>YouTube</b><span>@jeffre007y</span></span><span class="open">Subscribe</span></a></li>
    <li><a href="https://web.facebook.com/profile.php?id=61596556890494" target="_blank" rel="noopener" style="--c:#9db8ff;--bb:#1877f2" data-n="4" data-ch="CH 04  Facebook" data-tint="#9db8ff"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="f" d="M26 44V26h6l1-7h-7v-4c0-2 .8-3 3-3h4V6.4C32.4 6.3 30.6 6 28.6 6 23.4 6 20 9.1 20 14.6V19h-6v7h6v18z"/></svg></span><span class="nm"><b>Facebook</b><span>jeffre007y page</span></span><span class="open">Like</span></a></li>
  </ul>

  <div class="street" aria-hidden="true">
    <div class="person walker w1"><div class="in"></div></div>
    <div class="person walker w2 long"><div class="in"></div></div>
  </div>
  <footer>Every channel, one remote.</footer>
</main>
<script>
(function(){
  var P='<svg viewBox="0 0 100 {H}" aria-hidden="true"><ellipse class="sh" cx="50" cy="196" rx="26" ry="4"/><path class="hr hairb" d="M30 26c-5 20-3 42 7 56h26c10-14 12-36 7-56z"/><g class="legL"><path class="pant" d="M36 102h14l-2 76H37z"/><path class="shoe" d="M35 176h14c2 6 0 10-7 10H31c-1-5 1-8 4-10z"/></g><g class="legR"><path class="pant" d="M50 102h14l1 76H53z"/><path class="shoe" d="M52 176h14c3 2 5 5 4 10H58c-7 0-8-4-6-10z"/></g><g class="armL"><path class="sl" d="M33 58L27 82"/><path class="fo" d="M27 82L26 103"/><circle class="skin" cx="26" cy="106" r="4.6"/></g><path class="shirt" d="M30 56c0-7 8-9 20-9s20 2 20 9l3 52H27z"/><path class="skin" d="M44 44h12v8l-6 6-6-6z"/><path class="ft" d="M44 50l6 8 6-8"/><g class="head"><circle class="skin" cx="36" cy="30" r="3.6"/><circle class="skin" cx="64" cy="30" r="3.6"/><ellipse class="skin" cx="50" cy="28" rx="14" ry="17"/><path class="hr" d="M35 25c-1-15 8-20 15-20s16 5 15 20c-4-7-9-10-15-10s-11 3-15 10z"/><circle class="blush" cx="41" cy="36" r="3.4"/><circle class="blush" cx="59" cy="36" r="3.4"/><g class="eyes"><circle class="eye" cx="44" cy="29" r="1.9"/><circle class="eye" cx="56" cy="29" r="1.9"/></g><path class="ft" d="M41 24.5q3-2 6-.6M53 23.9q3-1.4 6 .6"/><path class="ft" d="M50 30v5l2 1"/><path class="ft" d="M44.5 40q5.5 5 11 0"/></g><g class="armR"><path class="sl" d="M67 58L73 82"/><path class="fo" d="M73 82L74 103"/><circle class="skin" cx="74" cy="106" r="4.6"/></g></svg>';
  var ps=document.querySelectorAll('.person');
  for(var i=0;i<ps.length;i++){(function(p){
    var half=p.hasAttribute('data-half'),h=half?'110':'200';
    var html=P.replace('{H}',h);
    if(half){html=html.replace(/<g class="leg[LR]">.*?<\/g>/g,'').replace(/<ellipse class="sh"[^>]*\/>/,'')}
    (p.querySelector('.in')||p).innerHTML=html;
    if(p.hasAttribute('data-jump')){p.addEventListener('click',function(){p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump')})}
  })(ps[i]);}

  var screen=document.getElementById('screen'),now=document.getElementById('now'),
      k1=document.getElementById('k1'),k2=document.getElementById('k2'),
      tint=screen.querySelector('.tintlayer'),t;
  function tune(a){
    screen.classList.add('tuning');
    now.textContent=a.getAttribute('data-ch');
    tint.style.background=a.getAttribute('data-tint');
    var n=parseInt(a.getAttribute('data-n'),10);
    k1.style.setProperty('--r',(n*55-120)+'deg');k2.style.setProperty('--r',(200-n*40)+'deg');
    clearTimeout(t);t=setTimeout(function(){screen.classList.remove('tuning')},380);
  }
  function reset(){tint.style.background='transparent';now.textContent='Pick a channel'}
  var links=document.querySelectorAll('.channels a');
  for(var j=0;j<links.length;j++){
    (function(a){
      a.addEventListener('mouseenter',function(){tune(a)});
      a.addEventListener('focus',function(){tune(a)});
      a.addEventListener('touchstart',function(){tune(a)},{passive:true});
      a.addEventListener('mouseleave',reset);
      a.addEventListener('blur',reset);
    })(links[j]);
  }
})();
</script>
</body>
</html>
